name: skinai_assist
description: Offline-first educational skin screening assistant. Not a diagnostic device.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  hive_ce: ^2.10.1
  hive_ce_flutter: ^2.2.0
  tflite_flutter: ^0.11.0
  flutter_secure_storage: ^9.2.4
  google_fonts: ^6.2.1
  uuid: ^4.5.1
  intl: 0.20.3
  camera: 0.12.2
  image_cropper: 13.0.0
  image: 4.12.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
flutter:
  uses-material-design: true
  assets:
    - assets/images/skinai_logo.png
    - assets/models/
